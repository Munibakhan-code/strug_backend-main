# Strug Live media server (self-hosted RTMP -> HLS) — media-only compose.
# Preferred local path: from repo root run `npm run dev:docker:up` (docker-compose.dev.yml
# already includes this service alongside Postgres + Redis).
#
# Local dev (Windows/Mac): use port mappings + host.docker.internal for backend hooks.
# Production Linux: you may use network_mode: host instead — see README.md.
#
# Copy .env.example to .env and set LIVE_HOOK_SECRET to match strug_backend-main/.env

services:
  mediamtx:
    build: .
    image: strug-mediamtx:local
    container_name: strug-mediamtx
    restart: unless-stopped
    ports:
      - "1935:1935"   # RTMP ingest (OBS)
      - "8888:8888"   # HLS playback
      - "8889:8889"   # WHIP (browser one-tap go-live)
      - "8189:8189/udp"  # WebRTC ICE
      - "9996:9996"   # VOD recording playback API
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      MTX_CONFFILE: /mediamtx.yml
      # No ?secret= on auth URL — notify.sh sends x-live-hook-secret header only.
      BACKEND_AUTH_URL: ${BACKEND_AUTH_URL:-http://host.docker.internal:5000/live-session/rtmp/auth}
      BACKEND_HOOK_URL: ${BACKEND_HOOK_URL:-http://host.docker.internal:5000/live-session/rtmp/event}
      LIVE_HOOK_SECRET: ${LIVE_HOOK_SECRET:-local-dev-live-hook-secret}
    volumes:
      - ./mediamtx.dev.yml:/mediamtx.yml:ro
      - ./notify.sh:/scripts/notify.sh:ro
      - ./recordings:/recordings
