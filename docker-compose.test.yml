# Throwaway Postgres for integration tests (Phase 2). Not used in prod/staging.
#   docker compose -f docker-compose.test.yml up -d
#   npx dotenv -e .env.test -- npx prisma migrate deploy   # or: npm run test:db:push
#   npm run test:int
# Port 5433 on the host avoids clashing with a local dev Postgres on 5432.
services:
  strug-test-db:
    image: postgres:16-alpine
    container_name: strug-test-db
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: strug_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data   # ephemeral — data is wiped on container restart
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d strug_test"]
      interval: 2s
      timeout: 3s
      retries: 20
